name: Accessibility problem
description: Something is hard or impossible to use with your access needs or assistive technology.
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Accessibility problems are treated as bugs. See [ACCESSIBILITY.md](https://github.com/Iyanuoluwa007/Signlytic_AI/blob/main/ACCESSIBILITY.md) for what we aim for.
        Not on GitHub? You can also use the [feedback form](https://forms.gle/oTy7Bi414fuThFc1A).
  - type: dropdown
    id: part
    attributes:
      label: Which part of Signlytic?
      options:
        - Website or online demo
        - Chrome extension
        - Desktop app on Windows
        - Desktop app on macOS
        - Local Python system (dashboard)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What got in the way?
      description: For example a control you could not reach with the keyboard, something your screen reader did not announce, text that was hard to read, or motion that was a problem.
    validations:
      required: true
  - type: input
    id: assistive
    attributes:
      label: Assistive technology or settings, if any
      placeholder: "for example NVDA with Firefox, VoiceOver, keyboard only, 200% zoom, high contrast"
  - type: input
    id: environment
    attributes:
      label: Operating system and browser
  - type: textarea
    id: expected
    attributes:
      label: What would have worked for you?
